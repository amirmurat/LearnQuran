name: Import verified Arabic Quran

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-quran.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-quran:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Tanzil Uthmani Quran v1.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen

          url = 'https://tanzil.net/pub/download/index.php?quranType=uthmani&outType=txt&agree=true'
          req = Request(url, headers={'User-Agent': 'LearnQuran/1.0'})
          with urlopen(req, timeout=60) as r:
              data = r.read()
          Path('data/quran-uthmani.txt').write_bytes(data)
          print(f'Downloaded {len(data)} bytes')
          PY

      - name: Verify completeness and Arabic Quran content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('data/quran-uthmani.txt')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          ayahs = [line.strip() for line in lines if line.strip() and not line.lstrip().startswith('#')]

          if len(ayahs) != 6236:
              raise SystemExit(f'Expected 6236 ayahs, found {len(ayahs)}')

          first = ayahs[0]
          last = ayahs[-1]
          if 'بِسْمِ' not in first or ('ٱلنَّاسِ' not in last and 'النَّاسِ' not in last):
              raise SystemExit('Boundary ayah verification failed')

          arabic = re.compile(r'[\u0600-\u06FF]')
          if not all(arabic.search(line) for line in ayahs):
              raise SystemExit('A non-Arabic ayah line was detected')

          print('Verified: 6236 ayahs, UTF-8 Arabic Uthmani text.')
          PY

      - name: Commit Quran text
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quran-uthmani.txt
          if git diff --cached --quiet; then
            echo "Quran text is already up to date."
            exit 0
          fi
          git commit -m "Add verified Arabic Quran text (Tanzil Uthmani v1.1)"
          git push

# Second commit intentionally triggers this workflow after it exists on main.
